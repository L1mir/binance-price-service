spring:
  application:
    name: binance-price-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:binance_prices}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

binance:
  base-url: ${BINANCE_BASE_URL:https://api.binance.com}
  symbol: ${BINANCE_SYMBOL:BNBUSDT}
  poll-interval: ${BINANCE_POLL_INTERVAL:PT30S}
  connect-timeout: ${BINANCE_CONNECT_TIMEOUT:PT5S}
  read-timeout: ${BINANCE_READ_TIMEOUT:PT10S}
