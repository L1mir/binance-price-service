spring:
  application:
    name: binance-price-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:binance_prices}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  web:
    # validation messages in API errors are always English, regardless of the server or client locale
    locale: en
    locale-resolver: fixed
  jackson:
    generator:
      # BigDecimal numbers are written as 0.00000001, not 1E-8
      write-bigdecimal-as-plain: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

binance:
  base-url: ${BINANCE_BASE_URL:https://api.binance.com}
  symbol: ${BINANCE_SYMBOL:BNBUSDT}
  poll-interval: ${BINANCE_POLL_INTERVAL:PT30S}
  connect-timeout: ${BINANCE_CONNECT_TIMEOUT:PT5S}
  read-timeout: ${BINANCE_READ_TIMEOUT:PT10S}

trend:
  flat-threshold-percent: ${TREND_FLAT_THRESHOLD_PERCENT:0.5}
